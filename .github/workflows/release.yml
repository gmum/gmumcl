# CI Release — build sdist + wheel and publish to PyPI on a `v*` tag.
#
# Mirrors ActivationScope's release flow:
#   - `v*` tag push          -> PyPI        (secret PYPI_API_TOKEN)
#   - branch push whose commit message contains `[testpypi]` -> TestPyPI
#     (secret TEST_PYPI_API_TOKEN)
#   - manual run with dry_run -> build only
#
# The publish jobs run in GitHub environments (`release`, `testpypi`) so
# required reviewers can gate them; delete the `environment:` lines to publish
# without approval. Tokens are project-scoped PyPI API tokens; see the README
# for the one-time setup.

name: CI Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If yes, build only — do not publish to PyPI."
        default: false
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the wheel installs and imports
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import gmumcl; print(gmumcl.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-to-pypi:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (stable)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://upload.pypi.org/legacy/
          verbose: true

  publish-to-testpypi:
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/') &&
      contains(github.event.head_commit.message, '[testpypi]')
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  dry-run:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Dry-run summary (no publishing)
        run: |
          echo "DRY-RUN — distributions downloaded in dist/ but NOT published."
          ls -lR dist/
