# CI: lint + test matrix (CPU-only, no dataset downloads)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src scripts tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # activationscope builds with -std=c++17; torch 2.9+ headers need C++20,
      # so torch is pinned to 2.8 (same recipe as the AdaReg environment).
      - name: Install build tools and CPU torch 2.8
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja numpy
          pip install "torch==2.8.*" --index-url https://download.pytorch.org/whl/cpu

      - name: Install activationscope (compiles the C++ extension against torch)
        run: pip install --no-build-isolation activationscope

      - name: Install gmumcl with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Run the quickstart example
        run: python examples/quickstart.py
