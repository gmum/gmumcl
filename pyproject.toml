[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmumcl"
version = "0.1.0"
description = "GMUM Continual Learning Framework"
authors = [
    { name = "Jan Miksa" },
    { name = "Patryk Krukowski" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "lightning>=2.3.0",
    "lightning-fabric>=2.3.0",
    "continuum>=1.2.7",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["gmumcl"]
