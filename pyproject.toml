[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmumcl"
version = "1.1.0"
description = "A generic continual-learning framework: scenarios, methods, metrics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["continual-learning", "pytorch", "class-incremental", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # activationscope builds with -std=c++17; torch headers after 2.8 need C++20
    "torch>=2.0,<2.9",
    "numpy",
    "PyYAML",
    "activationscope>=0.1.4",
]

[project.optional-dependencies]
datasets = ["torchvision"]
viz = ["matplotlib"]
test = ["pytest>=7", "torchvision", "ruff"]

[project.urls]
Repository = "https://github.com/gmum/gmumcl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
