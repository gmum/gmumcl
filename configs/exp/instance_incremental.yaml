# Instance-incremental Split MNIST: random partitions of all instances,
# every task mixes all classes.
# Run: python scripts/run.py --config configs/exp/instance_incremental.yaml
seed: 0

data:
  name: mnist
  scenario: instance_incremental
  root: data
  num_tasks: 5
  calibration_fraction: 0.0
  min_calibration: 0
  batch_size: 128

model:
  name: mlp
  input_dim: 784
  hidden: 400
  layers: 2
  growing_head: false

trainer:
  epochs: 4
  lr: 0.001
  device: cuda

method:
  name: l2
  lambda: 100.0
