# Sharpening on Split MNIST class-incremental.
# The Hsu-adapted protocol is reused so the row is comparable; alpha, gamma
# and K keep the original gmumcl defaults. See docs/results.md for the
# protocol, the documented deviation (differentiable target) and provenance.
# Run: python scripts/run.py --config configs/baselines/sharpening.yaml
seed: 0

data:
  name: mnist
  root: data
  classes_per_task: 2
  calibration_fraction: 0.0
  min_calibration: 0
  batch_size: 128

model:
  name: mlp
  input_dim: 784
  hidden: 400
  layers: 2
  growing_head: true

trainer:
  epochs: 4
  lr: 0.001
  device: cuda

method:
  name: sharpening
  alpha: 0.5                  # task-loss weight
  gamma: 0.1                  # sharpening strength
  K: 64                       # top-K active coordinates
