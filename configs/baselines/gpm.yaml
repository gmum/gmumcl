# GPM, port of `sahagobinda/GPM` (commit 1a238ec9) on Split MNIST
# class-incremental. The official thresholds (0.97 + 0.003 * task) and row
# cap are kept; the training protocol follows the Hsu-adapted setup used by
# the other rows so the numbers are comparable.
# See docs/results.md for the full protocol and documented deviations.
# Run: python scripts/run.py --config configs/baselines/gpm.yaml
seed: 0

data:
  name: mnist
  root: data
  classes_per_task: 2
  calibration_fraction: 0.0
  min_calibration: 0
  batch_size: 128

model:
  name: mlp
  input_dim: 784
  hidden: 400
  layers: 2
  growing_head: true

trainer:
  epochs: 4
  lr: 0.001
  device: cuda

method:
  name: gpm
  threshold_base: 0.97        # official energy thresholds
  threshold_step: 0.003
  max_rows: 125
