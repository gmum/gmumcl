# Dreaming on Split MNIST class-incremental.
# The Hsu-adapted protocol is reused so the row is comparable; the model uses
# the RBF head the method replays, and the generation budget follows the
# original gmumcl defaults. See docs/results.md for the protocol, provenance
# and documented deviations.
# Run: python scripts/run.py --config configs/baselines/dreaming.yaml
seed: 0

data:
  name: mnist
  root: data
  classes_per_task: 2
  calibration_fraction: 0.0
  min_calibration: 0
  batch_size: 128

model:
  name: mlp
  input_dim: 784
  hidden: 400
  layers: 2
  growing_head: true
  head_type: rbf

trainer:
  epochs: 4
  lr: 0.001
  device: cuda

method:
  name: dreaming
  alpha: 1.0                  # feature-distillation weight
  samples_per_class: 32
  steps: 100                  # per-class input optimisation steps
  in_shape: [1, 28, 28]
