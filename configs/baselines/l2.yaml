# L2, Hsu et al. (2018) Split MNIST class-incremental baseline.
# Protocol: 4 epochs/task, batch 128, Adam lr=1e-3, all training data.
# See docs/results.md for the full protocol and documented deviations.
# Run: python scripts/run.py --config configs/baselines/l2.yaml
seed: 0

data:
  name: mnist
  root: data
  classes_per_task: 2
  calibration_fraction: 0.0
  min_calibration: 0
  batch_size: 128

model:
  name: mlp
  input_dim: 784
  hidden: 400
  layers: 2
  growing_head: true

trainer:
  epochs: 4
  lr: 0.001
  device: cuda

method:
  name: l2
  lambda: 100.0               # Hsu et al. grid-search optimum
